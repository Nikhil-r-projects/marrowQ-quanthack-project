services:
  # 1. MarrowQ FastAPI Web Service
  - type: web
    name: marrowq-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # 2. MarrowQ Background Compute Worker
  - type: worker
    name: marrowq-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m app.worker"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
