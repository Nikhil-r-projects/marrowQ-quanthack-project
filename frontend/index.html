<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarrowQ</title>
    <meta name="description" content="Research-grounded clinical machine learning platform comparing Qiskit Fidelity Quantum-Kernel SVMs against classical baselines for HSCT neutrophil recovery prediction." />
    <meta name="theme-color" content="#f6f5f2" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('marrowq.theme') || '"light"');
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
